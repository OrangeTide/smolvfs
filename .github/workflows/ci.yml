name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y lcov libcurl4-openssl-dev

      - name: Build and test with coverage
        run: make CFLAGS="-Wall -Wextra -g -Og --coverage" test

      # The suite links only the test binaries, so a break in castool or
      # in the reference client would otherwise reach a release unbuilt.
      - name: Build the tools
        run: |
          make clean-all
          make all
          make cas-fetch

      # The default build compiles no signing backend, so the suite would
      # otherwise only ever exercise the cannot-verify path.
      - name: Test with the optional backends
        run: |
          make clean-all
          make MONOCYPHER=1 MINIZ=1 test

      - name: Generate coverage data
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.info
          format: lcov

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y libcurl4-openssl-dev

      # Expected clean.  One known false positive is suppressed at its
      # site in cas-omap.c with the reasoning written down.
      - name: gcc -fanalyzer
        run: make analyze

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASan and UBSan
        run: make sanitize
